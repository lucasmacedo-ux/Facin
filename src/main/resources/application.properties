spring.application.name=facin

# Conexão com o MySQL. Os valores vêm de variáveis de ambiente
# (NUNCA escreva usuário e senha reais neste arquivo).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/facin?createDatabaseIfNotExist=true&serverTimezone=America/Araguaina}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Cria/atualiza a tabela automaticamente durante o desenvolvimento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
