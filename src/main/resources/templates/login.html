<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facin - Login do administrador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/facin.css}">
</head>
<body>
<header class="topo">
    <div class="marca"><strong>Facin</strong><span>Fácil Informação</span></div>
</header>
<main>
<div class="card">
    <h1>Área do administrador</h1>
    <p class="sub">Entre para consultar os cadastros.</p>

    <div class="aviso erro" th:if="${param.error}">Usuário ou senha inválidos.</div>
    <div class="aviso ok" th:if="${param.logout}">Você saiu do sistema.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="largura">Entrar</button>
    </form>
    <p class="sub" style="margin-top:18px"><a th:href="@{/cadastro}">Voltar ao formulário de cadastro</a></p>
</div>
</main>
<footer>Facin - Unitins</footer>
</body>
</html>
